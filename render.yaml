databases:
  - name: landguard-postgres
    plan: free
    region: singapore
    databaseName: landguard_postgres
    user: landguard_postgres_user
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: landguard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landguard-postgres
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "1"
      - key: KEEP_LOCAL_UPLOADS
        value: "0"
